# Local development: API + PostgreSQL 16 with pgvector.
# Run from backend/:  cp ../.env.example ../.env  &&  docker compose up --build
# Then open http://localhost:8000/docs

services:
  api:
    build: .
    env_file: ../.env
    environment:
      MOCK_FIXTURES_DIR: /srv/fixtures
    volumes:
      # Canned answers for MOCK_MODE come straight from the frozen contract.
      - ../contracts/fixtures/api:/srv/fixtures:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
